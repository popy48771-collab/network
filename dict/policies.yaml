# 日本の文化政策の法令・計画・制度・事業。表層一致で拾う。
#
# 運用ルール:
#   - このファイルは人手で管理する。LLM に自動更新させない。
#     ここが勝手に変わると時系列比較の基準が動き、過去との比較が意味を失うため。
#   - aliases には「それ単独で他の文脈に出ない表記」だけを書く。
#     例: 「基本法」は他の基本法にも当たるので入れない。
#   - id は変えない。ラベルは変えてよい（表示名だけが変わる）。
#
# etype: law（法令）/ plan（計画・戦略）/ program（事業・制度）/ policy（政策概念）

