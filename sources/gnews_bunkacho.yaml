# Googleニュースの検索結果を RSS として受け取る。
# アカウント登録も認証も不要で、URL を組み立てるだけで監視対象を増やせる。
#   https://news.google.com/rss/search?q=<検索語>&hl=ja&gl=JP&ceid=JP:ja
# 検索語は URL エンコードする。hl / gl / ceid は3つセットで揃えること（食い違うと空になる）。
#
# tier: secondary なので、見出しとフィードの要約・URL しか保存しない（本文は取りに行かない）。

