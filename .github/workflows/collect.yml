name: collect

# 毎朝 sources/*.yaml のフィードを取得して articles/ に記事を追加し、
# 続けて共起ネットワークを作り直して out/ に書き戻す。
#
# なぜ収集と分析を1つのジョブでやるか:
#   GITHUB_TOKEN による push は新しいワークフローを起動しない（GitHub の仕様。
#   ワークフローが無限に連鎖するのを防ぐため）。収集ジョブが articles/ を push しても
#   analyze ワークフローは発火しないので、ここで続けて分析まで走らせる。
#   人が手で記事を置いたときは analyze.yml が push で発火する。

on:
  schedule:
    - cron: "0 21 * * *" # 06:00 JST。cron は UTC。5〜30分の遅延は日常なので時刻に依存しないこと
  workflow_dispatch:
    inputs:
      dry_run:
        description: "書き込まずに件数だけ確認する"
        type: boolean
        default: false
      show_all:
        description: "取れたアイテムを全件（日付付きで）出す"
        type: boolean
        default: false
      only:
        description: "このソースIDだけ取得する（例: bunka_hodo）"
        type: string
        default: ""
      probe_url:
        description: "収集せず、このURLが使えるかだけ確認する（フィードURLの下見）"
        type: string
        default: ""

permissions:
  contents: write

# analyze と同じグループにして、2つのワークフローが同時に out/ を書き戻さないようにする
concurrency:
  group: repo-write-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: 依存をインストール
        run: uv sync --frozen || uv sync

      - name: フィードを取得
        id: collect
        # 入力は env 経由で渡す（run に直接埋め込むとコマンドとして解釈されうる）
        env:
          PROBE_URL: ${{ inputs.probe_url }}
          ONLY: ${{ inputs.only }}
        run: |
          args=()
          ${{ inputs.dry_run && 'args+=(--dry-run)' || 'true' }}
          ${{ inputs.show_all && 'args+=(--show-all)' || 'true' }}
          if [ -n "$ONLY" ]; then args+=(--only "$ONLY"); fi
          if [ -n "$PROBE_URL" ]; then args+=(--probe "$PROBE_URL"); fi
          uv run python -m pipeline.collect "${args[@]}" | tee /tmp/collect.log
          {
            echo "## 収集結果"
            echo
            if [ -n "$PROBE_URL" ]; then
              echo '```'
              cat /tmp/collect.log
              echo '```'
            else
              sed -n '/^| ソース/,$p' /tmp/collect.log
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 共起ネットワークを再構築
        if: ${{ !inputs.dry_run && !inputs.probe_url }}
        run: |
          uv run python -m pipeline.run \
            --gexf-url "https://lite.gephi.org/?file=https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/out/network.gexf"

      - name: レポートをサマリに出す
        if: ${{ !inputs.dry_run && !inputs.probe_url }}
        run: |
          {
            echo
            echo "<details><summary>レポート全文</summary>"
            echo
            cat out/report.md
            echo
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 成果物をアップロード
        if: ${{ !inputs.dry_run && !inputs.probe_url }}
        uses: actions/upload-artifact@v4
        with:
          name: cooccurrence-network
          path: out/
          retention-days: 30

      - name: articles/ と out/ をコミット
        if: ${{ !inputs.dry_run && !inputs.probe_url }}
        run: |
          .github/scripts/commit-and-push.sh "${{ github.ref_name }}" \
            "collect: 記事を追加し、共起ネットワークを更新 ($(date -u +%Y-%m-%dT%H:%MZ)) [skip ci]" \
            articles out
