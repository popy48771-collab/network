<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>共起ネットワーク</title>
<style>
  :root {
    color-scheme: light;
    --surface-1: #fcfcfb;
    --page: #f9f9f7;
    --text-primary: #0b0b0b;
    --text-secondary: #52514e;
    --muted: #898781;
    --grid: #e1e0d9;
    --axis: #c3c2b7;
    --border: rgba(11,11,11,0.10);
    --term: #898781;
    --facility: #2a78d6;
    --policy: #eb6834;
    --edge: rgba(11,11,11,0.16);
    --edge-strong: rgba(11,11,11,0.42);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --surface-1: #1a1a19;
      --page: #0d0d0d;
      --text-primary: #ffffff;
      --text-secondary: #c3c2b7;
      --muted: #898781;
      --grid: #2c2c2a;
      --axis: #383835;
      --border: rgba(255,255,255,0.10);
      --term: #898781;
      --facility: #3987e5;
      --policy: #d95926;
      --edge: rgba(255,255,255,0.16);
      --edge-strong: rgba(255,255,255,0.46);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --surface-1: #1a1a19;
    --page: #0d0d0d;
    --text-primary: #ffffff;
    --text-secondary: #c3c2b7;
    --muted: #898781;
    --grid: #2c2c2a;
    --axis: #383835;
    --border: rgba(255,255,255,0.10);
    --term: #898781;
    --facility: #3987e5;
    --policy: #d95926;
    --edge: rgba(255,255,255,0.16);
    --edge-strong: rgba(255,255,255,0.46);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--page);
    color: var(--text-primary);
    font-family: system-ui, -apple-system, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif;
    font-size: 14px;
    line-height: 1.5;
    display: flex;
    flex-direction: column;
  }
  header { padding: 16px 20px 10px; }
  h1 { margin: 0; font-size: 17px; font-weight: 650; letter-spacing: .01em; }
  .meta { color: var(--text-secondary); font-size: 12px; margin-top: 4px; }

  /* フィルタは1行にまとめて、スコープする対象すべての上に置く */
  .filters {
    display: flex; flex-wrap: wrap; gap: 14px 20px; align-items: center;
    padding: 10px 20px; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border);
    background: var(--surface-1);
  }
  .filters label { font-size: 12px; color: var(--text-secondary); display: flex; align-items: center; gap: 7px; }
  .filters input[type=range] { width: 132px; accent-color: var(--facility); }
  .filters input[type=search] {
    font: inherit; font-size: 13px; padding: 5px 9px; min-width: 170px;
    border: 1px solid var(--axis); border-radius: 6px;
    background: var(--surface-1); color: var(--text-primary);
  }
  .filters .val { color: var(--text-primary); font-variant-numeric: tabular-nums; min-width: 34px; }
  button {
    font: inherit; font-size: 12px; padding: 5px 11px; border-radius: 6px;
    border: 1px solid var(--axis); background: var(--surface-1); color: var(--text-primary); cursor: pointer;
  }
  button:hover { background: var(--page); }
  button[aria-pressed="true"] { border-color: var(--facility); color: var(--facility); }

  main { flex: 1; display: flex; min-height: 0; }
  .canvas-wrap { flex: 1; position: relative; min-width: 0; background: var(--surface-1); }
  canvas { display: block; width: 100%; height: 100%; cursor: grab; }
  canvas.dragging { cursor: grabbing; }

  .legend {
    position: absolute; left: 14px; bottom: 14px;
    background: var(--surface-1); border: 1px solid var(--border); border-radius: 8px;
    padding: 9px 12px; font-size: 12px; color: var(--text-secondary);
    display: flex; flex-direction: column; gap: 5px;
  }
  .legend .row { display: flex; align-items: center; gap: 8px; }
  .legend svg { flex: none; }
  .legend .note { color: var(--muted); font-size: 11px; margin-top: 2px; }

  aside {
    width: 340px; flex: none; border-left: 1px solid var(--border);
    background: var(--surface-1); overflow-y: auto; padding: 14px 16px 24px;
  }
  aside h2 { font-size: 13px; margin: 0 0 8px; font-weight: 650; }
  aside h3 { font-size: 12px; margin: 18px 0 6px; font-weight: 650; color: var(--text-secondary); }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th, td { text-align: left; padding: 4px 6px; border-bottom: 1px solid var(--grid); }
  th { color: var(--text-secondary); font-weight: 600; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .empty { color: var(--muted); font-size: 12px; }
  .swatch { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 5px; }

  #tooltip {
    position: fixed; pointer-events: none; z-index: 10; max-width: 260px;
    background: var(--surface-1); border: 1px solid var(--border); border-radius: 7px;
    padding: 8px 10px; font-size: 12px; color: var(--text-primary);
    box-shadow: 0 3px 14px rgba(0,0,0,.14); opacity: 0; transition: opacity .08s;
  }
  #tooltip .t-label { font-weight: 650; }
  #tooltip .t-sub { color: var(--text-secondary); margin-top: 2px; }

  footer { padding: 10px 20px 16px; font-size: 11px; color: var(--muted); }
  @media (max-width: 860px) {
    main { flex-direction: column; }
    aside { width: auto; border-left: none; border-top: 1px solid var(--border); max-height: 42vh; }
    .canvas-wrap { min-height: 46vh; }
  }
</style>
</head>
<body>
<header>
  <h1>文化政策ニュース 共起ネットワーク</h1>
  <div class="meta" id="meta"></div>
</header>

<div class="filters">
  <label>NPMI 下限 <input type="range" id="npmi" min="0" max="0.9" step="0.02"><span class="val" id="npmiVal"></span></label>
  <label>ラベル表示数 <input type="range" id="labels" min="0" max="200" step="5" value="45"><span class="val" id="labelsVal">45</span></label>
  <label><input type="checkbox" id="kFacility" checked> 文化施設</label>
  <label><input type="checkbox" id="kPolicy" checked> 政策・制度</label>
  <label><input type="checkbox" id="kOther" checked> 組織・地域</label>
  <label><input type="search" id="search" placeholder="語を検索" autocomplete="off"></label>
  <button id="clusterBtn" aria-pressed="false">クラスタ名を重ねる</button>
  <button id="resetBtn">表示リセット</button>
</div>

<main>
  <div class="canvas-wrap">
    <canvas id="cv"></canvas>
    <div class="legend" id="legend">
      <div class="row"><svg width="14" height="14"><circle cx="7" cy="7" r="4.5" fill="var(--term)"></circle></svg>語</div>
      <div class="row"><svg width="14" height="14"><rect x="3" y="3" width="8" height="8" fill="var(--facility)"></rect></svg>文化施設</div>
      <div class="row"><svg width="14" height="14"><path d="M7 2 L12 7 L7 12 L2 7 Z" fill="var(--policy)"></path></svg>政策・制度・法令</div>
      <div class="row"><svg width="14" height="14"><path d="M7 2.5 L12 11.5 L2 11.5 Z" fill="var(--term)"></path></svg>組織・地域・人物</div>
      <div class="note">大きさ = 出現文数 / 線の太さ = NPMI</div>
    </div>
  </div>
  <aside>
    <h2 id="panelTitle">ノードを選択</h2>
    <div id="panelBody" class="empty">図の中のノードをクリックすると、結びつきの強い相手が表で出ます。</div>
    <h3>結びつきの強いペア（NPMI 上位）</h3>
    <table id="topTable">
      <thead><tr><th>ペア</th><th class="num">NPMI</th><th class="num">共起</th></tr></thead>
      <tbody></tbody>
    </table>
  </aside>
</main>

<div id="tooltip" role="status" aria-live="polite"></div>
<footer>
  共起は相関であって因果ではありません。頻度は収集したソースの偏りをそのまま反映します。
  同じ内容は <code>nodes.csv</code> / <code>edges.csv</code> / <code>report.md</code> にも出力されています。
</footer>

/* ---- 座標変換 ---- */
function fit() {
  const w = cv.clientWidth, h = cv.clientHeight;
  if (!nodes.length || !w || !h) return;
  const xs = nodes.map(n => n.x), ys = nodes.map(n => n.y);
  const minX = Math.min(...xs), maxX = Math.max(...xs);
  const minY = Math.min(...ys), maxY = Math.max(...ys);
  const pad = 70;
  const scale = Math.min((w - pad * 2) / (maxX - minX || 1), (h - pad * 2) / (maxY - minY || 1));
  view.scale = scale;
  view.tx = w / 2 - ((minX + maxX) / 2) * scale;
  view.ty = h / 2 - ((minY + maxY) / 2) * scale;
}
const sx = x => x * view.scale + view.tx;
const sy = y => y * view.scale + view.ty;
const radius = n => Math.max(3, n.size * 0.5 * Math.min(1.6, Math.max(0.55, view.scale * 0.6)));

/* ---- 描画 ---- */
function shape(path, group, x, y, r) {
  if (group === 'facility') { path.rect(x - r, y - r, r * 2, r * 2); return; }
  if (group === 'policy') {
    path.moveTo(x, y - r * 1.25); path.lineTo(x + r * 1.25, y);
    path.lineTo(x, y + r * 1.25); path.lineTo(x - r * 1.25, y); path.closePath(); return;
  }
  if (group === 'other') {
    path.moveTo(x, y - r * 1.2); path.lineTo(x + r * 1.1, y + r * 0.85);
    path.lineTo(x - r * 1.1, y + r * 0.85); path.closePath(); return;
  }
  path.moveTo(x + r, y); path.arc(x, y, r, 0, Math.PI * 2);
}

function draw() {
  const t = tokens();
  const dpr = window.devicePixelRatio || 1;
  const w = cv.clientWidth, h = cv.clientHeight;
  cv.width = w * dpr; cv.height = h * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);

  const focus = state.selected || state.hover;
  const focusIds = new Set();
  if (focus) {
    focusIds.add(focus.id);
    (adjacency.get(focus.id) || []).forEach(e => {
      if (e.npmi >= state.threshold) { focusIds.add(e.source); focusIds.add(e.target); }
    });
  }

  /* クラスタ名は色ではなく、薄い大きめのラベルで示す */
  if (state.showClusters && !focus) {
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    clusters.forEach(c => {
      ctx.fillStyle = t.muted;
      ctx.globalAlpha = 0.22;
      ctx.font = `600 ${Math.min(22, 13 + c.size * 0.35)}px system-ui, sans-serif`;
      ctx.fillText(c.label, sx(c.x), sy(c.y));
      ctx.globalAlpha = 1;
    });
  }

  /* エッジ: 細いヘアライン。太さは NPMI に比例 */
  visibleEdges.forEach(e => {
    const inFocus = focus && focusIds.has(e.source) && focusIds.has(e.target);
    if (focus && !inFocus) { ctx.globalAlpha = 0.10; } else { ctx.globalAlpha = 1; }
    ctx.strokeStyle = inFocus ? t.edgeStrong : t.edge;
    ctx.lineWidth = 0.5 + 2.0 * ((e.npmi - minNpmi) / (maxNpmi - minNpmi || 1));
    ctx.beginPath();
    ctx.moveTo(sx(e.s.x), sy(e.s.y));
    ctx.lineTo(sx(e.t.x), sy(e.t.y));
    ctx.stroke();
  });
  ctx.globalAlpha = 1;

  /* ノード: 重なりは2pxのサーフェス色リングで分離する */
  const q = state.query.trim();
  visibleNodes.forEach(n => {
    const dim = (focus && !focusIds.has(n.id)) || (q && !n.label.includes(q));
    ctx.globalAlpha = dim ? 0.18 : 1;
    const r = radius(n);
    const p = new Path2D();
    shape(p, n.group, sx(n.x), sy(n.y), r);
    ctx.fillStyle = colorOf(n.group, t);
    ctx.fill(p);
    ctx.lineWidth = 2; ctx.strokeStyle = t.surface;
    ctx.stroke(p);
    if (q && n.label.includes(q) && !dim) {
      ctx.lineWidth = 2; ctx.strokeStyle = t.text;
      const ring = new Path2D();
      shape(ring, n.group, sx(n.x), sy(n.y), r + 3.5);
      ctx.stroke(ring);
    }
  });
  ctx.globalAlpha = 1;

  /* ラベルは選択的に。上位 N + エンティティ + 注目中のノードだけ。
     重なったものは描かない（読めない字を重ねるより、出さない方がよい） */
  const topIds = new Set(
    [...visibleNodes].sort((a, b) => b.strength - a.strength)
      .slice(0, state.labelCount).map(n => n.id)
  );
  const candidates = visibleNodes.filter(n => {
    if (focus) return focusIds.has(n.id);
    if (q && n.label.includes(q)) return true;
    return topIds.has(n.id) || n.group !== 'term';
  });
  // 重要なものから先に場所を取る
  candidates.sort((a, b) => (b.group !== 'term') - (a.group !== 'term') || b.strength - a.strength);

  const boxes = [];
  const overlaps = (b) => boxes.some(o =>
    !(b.x1 < o.x0 || b.x0 > o.x1 || b.y1 < o.y0 || b.y0 > o.y1));

  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  candidates.forEach(n => {
    const isEntity = n.group !== 'term';
    ctx.font = `${isEntity ? 650 : 500} ${isEntity ? 13 : 12}px system-ui, sans-serif`;
    const w = ctx.measureText(n.label).width, h = isEntity ? 15 : 14;
    const r = radius(n);
    const x = sx(n.x), y = sy(n.y) + r + 3;
    const box = {x0: x - w / 2 - 2, x1: x + w / 2 + 2, y0: y - 1, y1: y + h + 1};
    const forced = focus && (n === focus || (q && n.label.includes(q)));
    if (!forced && overlaps(box)) return;
    boxes.push(box);
    ctx.lineWidth = 3.5; ctx.strokeStyle = t.surface;
    ctx.strokeText(n.label, x, y);
    ctx.fillStyle = isEntity ? t.text : t.secondary;
    ctx.fillText(n.label, x, y);
  });
}

/* ---- 当たり判定（最小24px相当のヒットエリア） ---- */
function pick(px, py) {
  let best = null, bestDist = Infinity;
  for (const n of visibleNodes) {
    const dx = px - sx(n.x), dy = py - sy(n.y);
    const d = Math.hypot(dx, dy);
    const hit = Math.max(12, radius(n) + 6);
    if (d < hit && d < bestDist) { best = n; bestDist = d; }
  }
  return best;
}

/* ---- サイドパネル（＝表ビュー。ツールチップだけに頼らせない） ---- */
const panelTitle = document.getElementById('panelTitle');
const panelBody = document.getElementById('panelBody');

function neighborRows(node) {
  return (adjacency.get(node.id) || [])
    .filter(e => e.npmi >= state.threshold)
    .sort((a, b) => b.npmi - a.npmi)
    .slice(0, 20)
    .map(e => {
      const other = e.source === node.id ? e.t : e.s;
      return `<tr><td><span class="swatch" style="background:${'var(--' + (other.group === 'facility' ? 'facility' : other.group === 'policy' ? 'policy' : 'term') + ')'}"></span>${esc(other.label)}</td>` +
             `<td class="num">${e.npmi.toFixed(3)}</td><td class="num">${e.cooc}</td></tr>`;
    }).join('');
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function showNode(node) {
  state.selected = node;
  if (!node) {
    panelTitle.textContent = 'ノードを選択';
    panelBody.className = 'empty';
    panelBody.textContent = '図の中のノードをクリックすると、結びつきの強い相手が表で出ます。';
    draw(); return;
  }
  const kindLabel = {term: '語', facility: '文化施設', policy: '政策・制度・法令', other: '組織・地域・人物'}[node.group];
  panelTitle.textContent = node.label;
  panelBody.className = '';
  panelBody.innerHTML =
    `<div style="color:var(--text-secondary);font-size:12px;margin-bottom:8px">` +
    `${kindLabel} ／ 出現 ${node.df} 文 ／ 次数 ${node.degree} ／ 媒介 ${node.betweenness.toFixed(4)}</div>` +
    `<table><thead><tr><th>共起相手</th><th class="num">NPMI</th><th class="num">共起</th></tr></thead>` +
    `<tbody>${neighborRows(node)}</tbody></table>`;
  draw();
}

function fillTopTable() {
  const rows = [...edges].sort((a, b) => b.npmi - a.npmi).slice(0, 40).map(e =>
    `<tr><td>${esc(e.s.label)} — ${esc(e.t.label)}</td>` +
    `<td class="num">${e.npmi.toFixed(3)}</td><td class="num">${e.cooc}</td></tr>`).join('');
  document.querySelector('#topTable tbody').innerHTML = rows || '<tr><td colspan="3" class="empty">なし</td></tr>';
}

/* ---- 操作 ---- */
let dragging = false, dragMoved = false, lastX = 0, lastY = 0;
cv.addEventListener('mousedown', e => {
  dragging = true; dragMoved = false; lastX = e.clientX; lastY = e.clientY;
  cv.classList.add('dragging');
});
window.addEventListener('mouseup', e => {
  if (dragging && !dragMoved) {
    const r = cv.getBoundingClientRect();
    showNode(pick(e.clientX - r.left, e.clientY - r.top));
  }
  dragging = false; cv.classList.remove('dragging');
});
window.addEventListener('mousemove', e => {
  if (dragging) {
    if (Math.abs(e.clientX - lastX) + Math.abs(e.clientY - lastY) > 3) dragMoved = true;
    view.tx += e.clientX - lastX; view.ty += e.clientY - lastY;
    lastX = e.clientX; lastY = e.clientY;
    draw();
    return;
  }
  const r = cv.getBoundingClientRect();
  if (e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom) return;
  const hit = pick(e.clientX - r.left, e.clientY - r.top);
  if (hit !== state.hover) { state.hover = hit; draw(); }
  if (hit) {
    const kindLabel = {term: '語', facility: '文化施設', policy: '政策・制度・法令', other: '組織・地域・人物'}[hit.group];
    tip.innerHTML = `<div class="t-label">${esc(hit.label)}</div>` +
      `<div class="t-sub">${kindLabel} ／ 出現 ${hit.df} 文 ／ つながり ${hit.degree}</div>`;
    tip.style.opacity = '1';
    tip.style.left = Math.min(e.clientX + 14, window.innerWidth - 270) + 'px';
    tip.style.top = (e.clientY + 16) + 'px';
  } else {
    tip.style.opacity = '0';
  }
});
cv.addEventListener('wheel', e => {
  e.preventDefault();
  const r = cv.getBoundingClientRect();
  const mx = e.clientX - r.left, my = e.clientY - r.top;
  const k = Math.exp(-e.deltaY * 0.0016);
  view.tx = mx - (mx - view.tx) * k;
  view.ty = my - (my - view.ty) * k;
  view.scale *= k;
  draw();
}, {passive: false});

const npmiInput = document.getElementById('npmi');
const npmiVal = document.getElementById('npmiVal');
npmiInput.min = String(Math.max(0, Math.floor(minNpmi * 50) / 50));
npmiInput.value = String(state.threshold);
npmiVal.textContent = state.threshold.toFixed(2);
npmiInput.addEventListener('input', () => {
  state.threshold = +npmiInput.value;
  npmiVal.textContent = state.threshold.toFixed(2);
  if (state.selected) showNode(state.selected); else recompute();
  recompute();
});
const labelsInput = document.getElementById('labels');
labelsInput.addEventListener('input', () => {
  state.labelCount = +labelsInput.value;
  document.getElementById('labelsVal').textContent = labelsInput.value;
  draw();
});
for (const [id, key] of [['kFacility', 'facility'], ['kPolicy', 'policy'], ['kOther', 'other']]) {
  document.getElementById(id).addEventListener('change', ev => {
    state.kinds[key] = ev.target.checked;
    recompute();
  });
}
document.getElementById('search').addEventListener('input', ev => {
  state.query = ev.target.value; draw();
});
const clusterBtn = document.getElementById('clusterBtn');
clusterBtn.addEventListener('click', () => {
  state.showClusters = !state.showClusters;
  clusterBtn.setAttribute('aria-pressed', String(state.showClusters));
  draw();
});
document.getElementById('resetBtn').addEventListener('click', () => {
  showNode(null); state.query = ''; document.getElementById('search').value = '';
  fit(); draw();
});
window.addEventListener('resize', () => { draw(); });

document.getElementById('meta').textContent =
  `記事 ${DATA.meta.n_docs} 件 ／ 期間 ${DATA.meta.period} ／ 文 ${DATA.meta.n_units} ／ ` +
  `ノード ${DATA.meta.n_nodes} ／ エッジ ${DATA.meta.n_edges} ／ 生成 ${DATA.meta.generated_at}`;

fillTopTable();
fit();
recompute();
</script>
</body>
</html>
